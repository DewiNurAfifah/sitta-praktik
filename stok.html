<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Informasi stok bahan ajar Universitas Terbuka">
  <title>Informasi Stok Bahan Ajar | SITTA UT</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="dashboard.html">
        <img class="logo-img" src="assets/logo-ut.png" alt="Logo Universitas Terbuka">
        <span class="brand-nama">SITTA - UT</span>
      </a>
      <nav class="nav" aria-label="Navigasi utama">
        <ul>
          <li><a href="dashboard.html">🏠 Dashboard</a></li>
          <li><a href="stok.html" aria-current="page">📦 Bahan Ajar</a></li>
          <li><a href="tracking.html">🚚 Tracking</a></li>
          <li><a href="#" id="btnLogout" class="logout">Logout</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="container">
    <section class="card" aria-labelledby="greeting">
      <h1 id="greeting">Informasi Bahan Ajar</h1>
      <p class="muted" id="infoUser"></p>
    </section>

    <section class="card" aria-labelledby="judul-stok">
      <h2 id="judul-stok">Stok Bahan Ajar</h2>

      <div class="form-row" style="align-items:end;margin-bottom:1rem">
        <div class="form-group" style="margin:0">
          <label for="cari">Cari bahan ajar</label>
          <input type="search" id="cari" placeholder="Ketik kode atau nama...">
        </div>
        <div class="form-group" style="margin:0">
          <button type="button" class="btn" id="btnTambah">+ Tambah Stok Baru</button>
        </div>
      </div>

            <div class="table-wrap">
        <table>
          <caption class="sr-only">Daftar stok bahan ajar</caption>
          <thead>
            <tr>
              <th scope="col">Kode Barang</th>
              <th scope="col">Kode Lokasi</th>
              <th scope="col">Nama Barang</th>
              <th scope="col">Jenis</th>
              <th scope="col">Edisi</th>
              <th scope="col">Stok</th>
              <th scope="col">Status</th>
              <th scope="col">Cover</th>
              <th scope="col">Aksi</th>
            </tr>
          </thead>
          <tbody id="tbStok"></tbody>
        </table>
      </div>
      <p class="total-bar" id="ringkasan" aria-live="polite"></p>
    </section>
  </main>

  <!-- MODAL: tambah stok -->
  <div class="modal" id="modalTambah" role="dialog" aria-modal="true" aria-labelledby="jdl-tambah" hidden>
    <div class="modal-panel">
      <button type="button" class="modal-tutup" data-tutup aria-label="Tutup">&times;</button>
      <h2 id="jdl-tambah">Tambah Stok Baru</h2>
      <p class="muted" id="infoMode"></p>
      <form id="formTambah" novalidate>
        <div class="form-row">
          <div class="form-group">
            <label for="kodeLokasi">Kode Lokasi</label>
            <input type="text" id="kodeLokasi" placeholder="mis. 0BDG01">
            <span class="error" id="err-kodeLokasi" role="alert"></span>
          </div>
          <div class="form-group">
            <label for="kodeBarang">Kode Barang</label>
            <input type="text" id="kodeBarang" placeholder="mis. EKMA4116">
            <span class="error" id="err-kodeBarang" role="alert"></span>
          </div>
        </div>
        <div class="form-group">
          <label for="namaBarang">Nama Barang</label>
          <input type="text" id="namaBarang" placeholder="mis. Pengantar Bisnis">
          <span class="error" id="err-namaBarang" role="alert"></span>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="jenisBarang">Jenis</label>
            <select id="jenisBarang">
              <option value="">-- Pilih --</option>
              <option value="BMP">BMP (Bahan Mata Pelajaran)</option>
              <option value="NonBMP">Non-BMP</option>
            </select>
            <span class="error" id="err-jenisBarang" role="alert"></span>
          </div>
          <div class="form-group">
            <label for="edisi">Edisi</label>
            <input type="number" id="edisi" min="1" placeholder="1">
            <span class="error" id="err-edisi" role="alert"></span>
          </div>
          <div class="form-group">
            <label for="stok">Stok</label>
            <input type="number" id="stok" min="0" placeholder="0">
            <span class="error" id="err-stok" role="alert"></span>
          </div>
        </div>
        <button type="submit" class="btn" id="btnSimpan">Simpan</button>
      </form>
    </div>
  </div>

  <footer class="site-footer"><div class="container">SITTA UT - Tugas Praktik 1 STSI4209 Pemrograman Berbasis Web</div></footer>

  <script src="js/data.js"></script>
  <script src="js/script.js"></script>
  <script src="js/stok.js"></script>
</body>
</html>
